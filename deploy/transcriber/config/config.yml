# =============================================================================
# Конфиг CPU-сборки "Транскрибатора".
# Рассчитан на сервер БЕЗ видеокарты: всё считается на CPU и в RAM.
# Программа сама займёт все ядра процессора.
# =============================================================================

# --- Сервер ---
server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

# --- Железо ---
hardware:
  # CPU-режим. Можно перебить переменной окружения DEVICE.
  device: "cpu"

  # Видеопамяти нет.
  vram_gb: 0

  # Сколько оперативной памяти у сервера (в ГБ). Влияет на размер контекста LLM.
  # Поставьте реальное значение своего сервера.
  ram_gb: 16

  # "auto" = занять ВСЕ ядра процессора.
  cpu_threads: "auto"

# --- Распознавание речи (Whisper) ---
whisper:
  # На CPU используем faster-whisper (int8).
  engine: "faster"
  use_hf_model: false

  # Модель. Перебивается переменной WHISPER_MODEL.
  # large-v3 = лучшая точность, но медленно на CPU.
  # Быстрее (с потерей точности): medium | small | base | tiny.
  fallback_model: "large-v3"

  compute_type: "int8"

  # Ширина луча: больше = точнее, но медленнее.
  beam_size: 5

  # Русская дообученная модель: конвертируется в ct2 при первом запуске
  # (качает ~3 ГБ, разово). Пусто "" = обычный fallback_model.
  # Точнее large-v3 на русском. Чтобы отключить — поставь "".
  ru_model: "antony66/whisper-large-v3-russian"
  ru_ct2_dir: "/models/whisper-ru-ct2"

# --- Шумоподавление аудио ---
audio:
  # Чистка шума перед распознаванием (noisereduce). Помогает на шумном телефоне.
  denoise: true

# --- Пересказ (локальная LLM) ---
llm:
  enabled: true
  repo: "bartowski/Qwen2.5-7B-Instruct-GGUF"
  filename: "Qwen2.5-7B-Instruct-Q4_K_M.gguf"
  local_path: "/models/qwen/Qwen2.5-7B-Instruct-Q4_K_M.gguf"

  # LLM правит ошибки распознавания перед саммари (без словаря, по контексту).
  # Заметно чище текст и термины, но +проходы LLM (на CPU медленнее).
  correct_transcript: true

# --- Диаризация (кто когда говорит) ---
diarization:
  enabled: true

# --- Ручные переопределения (null = авто) ---
overrides:
  llm_gpu_layers: null   # на CPU всё равно 0
  llm_context: null
  llm_threads: null      # null = все ядра
