<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Транскрибатор</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
  h1 { font-size: 1.5rem; }
  .card { border: 1px solid #8884; border-radius: 10px; padding: 20px; margin-top: 16px; }
  input[type=file] { width: 100%; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; margin-top: 12px; }
  button:disabled { background: #888; cursor: default; }
  .muted { color: #888; font-size: .9rem; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  pre { background: #8881; padding: 12px; border-radius: 8px; overflow: auto; max-height: 320px; font-size: .85rem; }
  .hidden { display: none; }
  .err { color: #dc2626; }
  .ok { color: #16a34a; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 3px solid #8884; border-top-color: #2563eb; border-radius: 50%; animation: s 1s linear infinite; vertical-align: middle; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1>🎙 Транскрибатор</h1>
  <p class="muted">Загрузите аудиозапись разговора — получите транскрибацию, спикеров и структурированный разбор (темы, решения, задачи, риски).</p>

  <div class="card">
    <input type="file" id="file" accept=".mp3,.wav,.m4a,.ogg,.flac,.webm">
    <div class="row">
      <button id="go">Обработать</button>
      <span id="status" class="muted"></span>
    </div>
    <p class="muted">Поддерживаются: mp3, wav, m4a, ogg, flac, webm. Обработка на CPU может занять время.</p>
  </div>

  <div id="result" class="card hidden">
    <div class="row">
      <button id="download">⬇ Скачать JSON</button>
      <span id="saved" class="muted"></span>
    </div>
    <h3 id="rtitle"></h3>
    <p id="rsummary"></p>
    <pre id="rjson"></pre>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let lastResult = null, lastName = "result";

$("go").onclick = async () => {
  const f = $("file").files[0];
  if (!f) { setStatus("Выберите файл", true); return; }
  lastName = f.name.replace(/\.[^.]+$/, "");
  $("go").disabled = true;
  $("result").classList.add("hidden");
  setStatus('<span class="spin"></span> обработка… не закрывайте вкладку');

  const fd = new FormData();
  fd.append("file", f);
  try {
    const res = await fetch("/api/transcribe", { method: "POST", body: fd });
    if (!res.ok) {
      const t = await res.text();
      setStatus("Ошибка: " + t.slice(0, 300), true);
    } else {
      lastResult = await res.json();
      showResult(lastResult);
      setStatus("Готово", false, true);
    }
  } catch (e) {
    setStatus("Сбой запроса: " + e, true);
  } finally {
    $("go").disabled = false;
  }
};

$("download").onclick = () => {
  if (!lastResult) return;
  const blob = new Blob([JSON.stringify(lastResult, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = lastName + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
};

function setStatus(html, isErr, isOk) {
  const s = $("status");
  s.innerHTML = html;
  s.className = isErr ? "err" : (isOk ? "ok" : "muted");
}

function showResult(d) {
  $("result").classList.remove("hidden");
  const s = d.summary || {};
  $("rtitle").textContent = s.title || "(тема не определена)";
  $("rsummary").textContent = s.summary || "";
  $("saved").textContent = d.saved_to ? ("сохранено на сервере: " + d.saved_to) : "";
  $("rjson").textContent = JSON.stringify(d, null, 2);
}
</script>
</body>
</html>
