# =============================================================================
# Главный конфиг проекта "Транскрибатор".
# Один файл управляет всем: моделями, сервером и распределением ресурсов.
#
# Идея простая: ты описываешь своё железо в секции hardware, а программа
# сама решает, какую модель класть на GPU, сколько слоёв, какой контекст
# и сколько потоков использовать. Если что-то хочешь задать руками —
# пиши значение в секции overrides, оно перебьёт авто-настройку.
# =============================================================================

# --- Сервер ---
server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

# --- Железо ---
# Здесь ты описываешь свой компьютер. Программа по этим числам сама
# распределит ресурсы. Можно поставить "auto" — тогда железо определится
# автоматически (есть ли CUDA, MPS, сколько ядер у процессора).
hardware:
  # "auto" = определить автоматически.
  # Можно задать вручную: "cuda", "mps" или "cpu".
  device: "auto"

  # Сколько у тебя видеопамяти в гигабайтах (если есть GPU).
  # Нужно, чтобы решить: класть ли большую LLM на видеокарту.
  # Поставь 0, если видеокарты нет.
  vram_gb: 11

  # Сколько оперативной памяти в гигабайтах.
  ram_gb: 30

  # Сколько ядер процессора использовать.
  # "auto" = взять все доступные.
  cpu_threads: "auto"

# --- Модель распознавания речи (Whisper) ---
whisper:
  # Движок: whispercpp (GPU, под Pascal) | faster (faster-whisper, CPU/GPU)
  engine: "faster"

  # Модель whisper.cpp в формате ggml (качается при первом запуске).
  ggml_repo: "ggerganov/whisper.cpp"
  ggml_model: "ggml-large-v3.bin"
  ggml_path: "/models/ggml-large-v3.bin"

  # Русский дообученный Whisper. На Pascal-GPU (1080 Ti) float16 медленный,
  # поэтому по умолчанию используем faster-whisper int8 (use_hf_model: false)
  hf_model: "bond005/whisper-podlodka-turbo"
  use_hf_model: false

  # Основная модель при use_hf_model: false (faster-whisper).
  # Варианты: tiny | base | small | medium | large-v3
  fallback_model: "medium"

  # Устройство Whisper. "auto" = как у LLM. На Pascal-GPU (1080 Ti) ct2 не
  # работает, поэтому держим Whisper на cpu (LLM при этом остаётся на gpu).
  device: "cpu"

  # Тип вычислений. "auto" = по GPU: Pascal/CPU -> int8, новее -> float16.
  # Можно задать вручную: int8 | int8_float32 | float16 | float32
  compute_type: "auto"

  # Ширина луча при распознавании. Больше = точнее, но медленнее.
  # Главная ручка под бюджет времени: не влезаешь в 10 мин — снижай (5 -> 2)
  beam_size: 5

# --- Модель пересказа (LLM) ---
llm:
  enabled: true

  # GGUF-модель, которую программа скачает с HuggingFace при первом запуске.
  repo: "bartowski/Qwen2.5-7B-Instruct-GGUF"
  filename: "Qwen2.5-7B-Instruct-Q4_K_M.gguf"
  local_path: "/models/qwen/Qwen2.5-7B-Instruct-Q4_K_M.gguf"

# --- Диаризация (кто когда говорит) ---
diarization:
  enabled: true

# --- Ручные переопределения ---
# Всё, что здесь напишешь, перебьёт автоматический расчёт.
# Оставь null, чтобы программа решала сама.
overrides:
  # Сколько слоёв LLM положить на GPU. -1 = все, 0 = только CPU.
  llm_gpu_layers: null
  # Размер контекста LLM (в токенах). Больше = больше памяти.
  llm_context: 16384
  # Потоки для LLM.
  llm_threads: null
