services:
  transcriber:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./OUTPUTS:/app/OUTPUTS    # готовые разборы (папки с JSON)
      - ./models:/models          # скачанные модели (кешируются между запусками)
      - ./transcriber:/app/transcriber   # код (правки без пересборки образа)
      - ./config.yml:/app/config.yml   # конфиг (правки без пересборки)
      - ./data:/app/data          # БД задач и логов + сохранённые загрузки (переживает перезапуск)
    environment:
      - CONFIG_PATH=config.yml
      - DEVICE=cpu                 # принудительно CPU
      - WHISPER_MODEL=large-v3     # точность; для скорости: medium / small
      - HUGGINGFACE_HUB_CACHE=/models
      - HF_HOME=/models
      - DATA_DIR=/app/data         # где лежат jobs.db и uploads/
    restart: unless-stopped
