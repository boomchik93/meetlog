services:
  transcriber:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./OUTPUTS:/app/OUTPUTS            # готовые разборы (папки с JSON)
      - ./models:/models                  # веса моделей, кешируются между запусками
      - ./data:/app/data                  # jobs.db, логи и сохранённые загрузки
      - ./transcriber:/app/transcriber    # код: правки без пересборки образа
      - ./config.yml:/app/config.yml      # конфиг: правки без пересборки
    environment:
      - CONFIG_PATH=config.yml
      - DATA_DIR=/app/data
      - HUGGINGFACE_HUB_CACHE=/models
      - HF_HOME=/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
